<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="The St. Louis OSINT Society">
<title>The St. Louis OSINT Society</title>
<style>
:root{color-scheme:dark;--electric:#3e9cff;--pale:#82c5ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}
body{color:var(--electric);font-family:Arial,Helvetica,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;position:relative;isolation:isolate}
main .arch-backdrop{position:absolute;z-index:-1;top:clamp(70px,13svh,150px);left:50%;width:min(94vw,90svh,950px);height:min(94vw,90svh,950px);transform:translateX(-50%);object-fit:contain;opacity:.16;filter:drop-shadow(0 0 3px rgba(130,197,255,.9)) drop-shadow(0 0 12px rgba(45,143,255,.8)) drop-shadow(0 0 32px rgba(0,105,255,.6));pointer-events:none;user-select:none}
main .content{position:relative;z-index:1;width:100%;padding-top:clamp(8rem,27svh,18rem)}
main:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 48% 25% at 50% 48%,rgba(0,78,160,.11),transparent 75%);pointer-events:none}
h1{margin:0;max-width:100%;white-space:nowrap;font-size:clamp(10px,4.15vw,76px);font-weight:700;letter-spacing:.045em;line-height:1.25;text-transform:uppercase;color:#8bcaff;text-shadow:0 0 3px #d5efff,0 0 9px #65b8ff,0 0 18px #168cff,0 0 36px #007bff,0 0 75px rgba(0,111,255,.95),0 0 135px rgba(0,92,255,.65)}
.tagline{margin:3.1rem 0 0;font-size:clamp(.75rem,1.7vw,1.13rem);font-weight:400;letter-spacing:.1em;color:#9dd4ff;text-shadow:0 0 4px #b8e2ff,0 0 12px #238fff,0 0 28px #006dff,0 0 55px rgba(0,105,255,.7)}
@media(max-width:600px){main{padding:1rem}.arch-backdrop{top:23svh!important;width:min(110vw,75svh)!important;height:min(110vw,75svh)!important}.content{padding-top:22svh!important}h1{font-size:4.05vw;letter-spacing:0}.tagline{line-height:1.8;max-width:23rem;margin-top:2.5rem}}
@media(prefers-reduced-motion:no-preference){h1,.tagline{animation:materialize 1.7s ease-out both}.tagline{animation-delay:.3s}@keyframes materialize{from{opacity:0;filter:blur(9px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}}
</style>
</head>
<body>
<main>
<img class="arch-backdrop" src="./arch-eye.svg" alt="" aria-hidden="true">
<div class="content">
<h1>The St. Louis OSINT Society</h1>
<p class="tagline">There is no hiding from the all-seeing Arch</p>
</div>
</main>
</body>
</html>
