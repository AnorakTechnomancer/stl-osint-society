<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="The St. Louis OSINT Society. Not everything hidden is meant to stay hidden.">
  <title>The St. Louis OSINT Society</title>
  <style>
    :root{color-scheme:dark;--ink:#050a12;--blue:#0b1b31;--mist:#c5d5e7;--dim:#71869d}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:radial-gradient(ellipse at 50% 38%,#122945 0%,#091525 37%,var(--ink) 76%);color:var(--mist);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,rgba(0,0,0,.11) 50%);background-size:100% 4px;opacity:.25}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.58) 100%)}
    main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;z-index:1}
    .mark{width:68px;height:68px;border:1px solid rgba(132,171,209,.32);transform:rotate(45deg);display:grid;place-items:center;margin-bottom:3.8rem;box-shadow:0 0 60px rgba(39,102,160,.1)}
    .mark span{transform:rotate(-45deg);font-size:1.1rem;letter-spacing:.14em;color:#89a9ca;font-weight:300}
    h1{margin:0;text-transform:uppercase;font-weight:300;letter-spacing:.22em;font-size:clamp(1.65rem,4.5vw,4.2rem);line-height:1.3;text-wrap:balance;max-width:1000px}
    h1 span{display:block;font-size:.43em;letter-spacing:.48em;color:#8ca8c5;margin-bottom:1rem}
    .rule{height:1px;width:76px;background:linear-gradient(90deg,transparent,#7d9cbd,transparent);margin:2.8rem auto 1.5rem}
    p{color:var(--dim);font-family:Georgia,serif;font-style:italic;font-size:clamp(.9rem,1.4vw,1.08rem);letter-spacing:.055em;margin:0}
    footer{position:absolute;bottom:2rem;color:#4b627b;font-size:.65rem;letter-spacing:.28em;text-transform:uppercase}
    @media(prefers-reduced-motion:no-preference){.mark{animation:appear 1.8s ease both}h1,p,.rule{animation:rise 1.4s ease both}@keyframes appear{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
    @media(max-width:600px){h1{letter-spacing:.12em}h1 span{letter-spacing:.25em}.mark{margin-bottom:3rem}}
  </style>
</head>
<body>
  <main>
    <!-- Replace this temporary monogram with the society logo when ready. -->
    <div class="mark" aria-hidden="true"><span>STL</span></div>
    <h1><span>The St. Louis</span>OSINT Society</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Not everything hidden is meant to stay hidden.</p>
    <footer>St. Louis, Missouri</footer>
  </main>
</body>
</html>
