<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="The St. Louis OSINT Society">
<title>The St. Louis OSINT Society</title>
<style>
:root{color-scheme:dark;--electric:#3e9cff;--pale:#82c5ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}
body{color:var(--electric);font-family:Arial,Helvetica,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;position:relative;isolation:isolate}
main:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 48% 25% at 50% 48%,rgba(0,78,160,.11),transparent 75%);pointer-events:none}
h1{margin:0;font-size:clamp(2.3rem,7.5vw,6.7rem);font-weight:700;letter-spacing:.13em;line-height:1.2;text-transform:uppercase;text-shadow:0 0 9px rgba(39,138,255,.75),0 0 28px rgba(0,102,255,.5),0 0 80px rgba(0,89,255,.23)}
h1 span{display:block}
h1 .location{font-size:.35em;font-weight:400;letter-spacing:.42em;margin-bottom:1.1em;color:var(--pale)}
.tagline{margin:3.1rem 0 0;font-size:clamp(.83rem,1.7vw,1.13rem);font-weight:400;letter-spacing:.11em;color:#79baff;text-shadow:0 0 10px rgba(0,128,255,.65),0 0 30px rgba(0,80,255,.25)}
@media(max-width:600px){h1{letter-spacing:.065em}h1 .location{letter-spacing:.2em}.tagline{line-height:1.8;max-width:23rem}}
@media(prefers-reduced-motion:no-preference){h1,.tagline{animation:materialize 1.7s ease-out both}.tagline{animation-delay:.3s}@keyframes materialize{from{opacity:0;filter:blur(9px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}}
</style>
</head>
<body>
<main>
<h1><span class="location">The St. Louis</span><span>OSINT</span><span>Society</span></h1>
<p class="tagline">There is no hiding from the all-seeing Arch</p>
</main>
</body>
</html>
